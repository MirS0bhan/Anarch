[package]
name = "anarch-rs"
description = "archlinux conf manger"
repository = "https://github.com/mirs0bhan/Anarch"
readme = "README.md"
version = "0.1.0"
edition = "2024"
include = ["**/*.rs"]
license-file = "LICENSE"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
clap = { version = "4.0", features = ["derive"] }
toml = "0.8.22"
home = "0.5.11"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
